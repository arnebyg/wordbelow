<span class="tile w" style="left:63px">W<small>8</small></span><span class="tile w" style="left:129px;animation-delay:.06s">O<small>2</small></span><span class="tile w" style="left:195px;animation-delay:.12s">R<small>1</small></span><span class="tile w" style="left:261px;animation-delay:.18s">D<small>1</small></span>
<span class="tile b" style="left:30px">B<small>4</small></span><span class="tile b" style="left:96px;animation-delay:.05s">E<small>1</small></span><span class="tile b" style="left:162px;animation-delay:.1s">L<small>1</small></span><span class="tile b" style="left:228px;animation-delay:.15s">O<small>2</small></span><span class="tile b" style="left:294px;animation-delay:.2s">W<small>8</small></span>

</div></div>
<script>
// Once per session; a tap ends it at once.
(function () {
  var el = document.getElementById("splash"), seen = false;
  try { seen = sessionStorage.getItem("wb-splash") === "1"; sessionStorage.setItem("wb-splash", "1"); } catch (e) {}
  if (seen || /[?&]nosplash/.test(location.search)) { el.remove(); return; }
  var done = function () { if (!el.parentNode) return; el.classList.add("out"); setTimeout(function () { el.remove(); }, 400); };
  var t = setTimeout(done, matchMedia("(prefers-reduced-motion: reduce)").matches ? 900 : 4000);
  el.addEventListener("pointerdown", function () { clearTimeout(t); done(); });
})();
</script>
